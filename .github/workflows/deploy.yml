# main への push で Cloudflare Workers (Static Assets) へ自動デプロイする。
#
# 必要なリポジトリシークレット（Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   … 「Workers スクリプトを編集」権限付きの API トークン
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare ダッシュボード右下に表示されるアカウント ID
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
